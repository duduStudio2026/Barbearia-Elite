<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Barbearia Elite</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: radial-gradient(circle at top, #1a1a1a, #000);
  color: white;
  text-align: center;
  overflow-x: hidden;
}

/* GLOW BACKGROUND */
body::before {
  content: "";
  position: fixed;
  width: 300px;
  height: 300px;
  background: #d4af37;
  filter: blur(120px);
  top: -100px;
  left: -100px;
  opacity: 0.2;
  animation: moveGlow 8s infinite alternate;
}

@keyframes moveGlow {
  from { transform: translate(0,0); }
  to { transform: translate(200px,150px); }
}

/* CONTAINER */
.container {
  max-width: 400px;
  margin: auto;
  padding: 30px 20px;
}

/* PERFIL */
.perfil {
  animation: fadeDown 1s ease;
}

.perfil img {
  width: 95px;
  height: 95px;
  border-radius: 50%;
  border: 2px solid #d4af37;
  box-shadow: 0 0 20px #d4af37;
}

.perfil h2 {
  margin-top: 10px;
}

.perfil p {
  color: #aaa;
  font-size: 14px;
  margin-bottom: 25px;
}

/* BOTÕES */
.botao {
  position: relative;
  display: flex;
  justify-content: space-between;
  align-items: center;

  margin: 12px 0;
  padding: 16px;

  border-radius: 14px;
  text-decoration: none;
  color: white;
  font-weight: bold;

  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);

  border: 1px solid rgba(255,255,255,0.1);

  overflow: hidden;

  animation: fadeUp 0.8s ease forwards;
  opacity: 0;
}

/* DELAY CASCATA */
.botao:nth-child(2) { animation-delay: 0.2s; }
.botao:nth-child(3) { animation-delay: 0.4s; }
.botao:nth-child(4) { animation-delay: 0.6s; }
.botao:nth-child(5) { animation-delay: 0.8s; }
.botao:nth-child(6) { animation-delay: 1s; }

/* BRILHO ANIMADO */
.botao::before {
  content: "";
  position: absolute;
  width: 50%;
  height: 100%;
  background: linear-gradient(120deg, transparent, rgba(212,175,55,0.6), transparent);
  top: 0;
  left: -100%;
  transition: 0.5s;
}

.botao:hover::before {
  left: 100%;
}

/* HOVER */
.botao:hover {
  border: 1px solid #d4af37;
  box-shadow: 0 0 15px #d4af37;
  transform: scale(1.04);
}

/* CLICK */
.botao:active {
  transform: scale(0.97);
}

/* ÍCONE */
.icon {
  font-size: 18px;
}

/* ANIMAÇÕES */
@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes fadeDown {
  from {
    opacity: 0;
    transform: translateY(-20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.footer {
  margin-top: 25px;
  font-size: 12px;
  color: #666;
}

</style>
</head>

<body>

<div class="container">

  <div class="perfil">
    <img src="https://via.placeholder.com/150">
    <h2>Barbearia Elite</h2>
    <p>Cortes modernos • Degradê • Barba na régua</p>
  </div>

  <a class="botao" href="#">
    <span>✂️ Agendar horário</span>
    <span class="icon">›</span>
  </a>

  <a class="botao" href="#">
    <span>📍 Localização</span>
    <span class="icon">›</span>
  </a>

  <a class="botao" href="#">
    <span>💈 Serviços</span>
    <span class="icon">›</span>
  </a>

  <a class="botao" href="#">
    <span>🔥 Promoções</span>
    <span class="icon">›</span>
  </a>

  <a class="botao" href="#">
    <span>📱 WhatsApp</span>
    <span class="icon">›</span>
  </a>

  <div class="footer">
    © 2026 Barbearia Elite
  </div>

</div>

</body>
</html>
